---
layout: default
title: Software
permalink: /software/
description: Software created by Charalampos Kardaris.
---

<table id="software-table" class="post-table">
  <tbody>
    {%- for item in site.data.software -%}
      <tr>
        <td>
          <img src="/assets/{{ item.svg }}">
          <span>
            <a href="{{ item.url }}" class="post-link">{{ item.name }}</a>
            {% if item.archived %}
              <span style="font-style: italic">(archived)</span>
            {% endif %}
          </span>
          <div>{{ item.description }}</div>
          <div>[{{ item.technologies | join: " · " }}]</div>
        </td>
      </tr>
    {%- endfor -%}
  </tbody>
</table>
